_format_version: '2.1'
_transform: true

###
### API keys. Both are JWTs; only the decoded `role` claim differs.
###
consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  ## Open auth routes — no apikey required (email confirm links, OAuth callback)
  - name: auth-v1-open
    url: http://hardened-auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors

  - name: auth-v1-open-callback
    url: http://hardened-auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors

  - name: auth-v1-open-authorize
    url: http://hardened-auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors

  ## GoTrue
  - name: auth-v1
    _comment: 'GoTrue: /auth/v1/* -> http://hardened-auth:9999/*'
    url: http://hardened-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      # HARDENED(auth): auth-001. GoTrue does not rate-limit the password grant
      # in this version, so the limit is applied at the gateway. harden.sh sets
      # HARDENED_RATE_LIMIT low for the `auth` class and high otherwise, so this
      # plugin is present in every hardened build and only BINDS for that class.
      - name: rate-limiting
        config:
          minute: $HARDENED_RATE_LIMIT
          policy: local
          limit_by: ip
          fault_tolerant: true
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## PostgREST
  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://hardened-rest:3000/*'
    url: http://hardened-rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Storage
  - name: storage-v1
    _comment: 'Storage: /storage/v1/* -> http://hardened-storage:5000/*'
    url: http://hardened-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
